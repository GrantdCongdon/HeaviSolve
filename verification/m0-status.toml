# ADR-007 distinguishes section12 acceptance, deliverables, and exit.
[acceptance]
language_slab_comparison = true
spice_measured_scoring = true
ci_stored_numerical_outputs = true
ci_license_scan_green = true

[deliverables]
phase_r_decisions_dispositioned = true
spike_reports_complete = true
repository_docs_and_standards = true
dependency_strategy_and_container = true

[exit]
adrs_accepted_and_merged = true
walking_skeleton_self_review = true

# These are actual scoped experiment outcomes, not acceptance booleans.
[spikes]
S1 = "PASS: one-rank complex cavity and declared-license audit on Linux/macOS"
S2 = "PASS: documentary reuse decision"
S3a = "LOCAL PASS: callbacks, IHP HBT smoke, OSDI"
S3b = "SCOPED PASS: macOS local and Linux CI builds/API/HB; IHP smoke local"
S3c = "FAIL: original IHP self-heated AC and strict DC disagreement"
S4 = "LOCAL PASS: mesh quality and prism import"
S5 = "SCOPED LOCAL PASS: repaint throughput and cut plane; compositor rate unmeasured"
S6 = "MIXED: KLayout geometry pass; gdstk SiEPIC OAS fail; viewport measured"
S7 = "LOCAL PASS: native mapped-array path; not universal zero-copy"
