name: SPICE Linux research subset (not M0 certification)
# Research evidence only; source/runtime admission remains separate under ADR-002.
on:
  workflow_dispatch:
  push:
    branches: [m0-evidence]
    paths:
      - ".github/workflows/spice-research.yml"
      - "tools/build_spice_stack.py"
      - "verification/spice/**"
permissions:
  contents: read
jobs:
  native-spice:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare research build tools and numerical support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ gfortran make flex bison m4 libblas-dev liblapack-dev libsuitesparse-dev libfftw3-dev
          mkdir -p "$RUNNER_TEMP/hs-spice/evidence"
          dpkg-query -W -f='${Package}\t${Version}\n' > "$RUNNER_TEMP/hs-spice/evidence/os-package-versions.txt"
      - name: Pinned native builds and closed-form subset
        run: python tools/build_spice_stack.py --work "$RUNNER_TEMP/hs-spice" --jobs 2 --research-candidates
      - name: Retain output even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spice-linux-research
          path: ${{ runner.temp }}/hs-spice/evidence/
